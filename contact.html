<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お問い合わせフォーム</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/contact.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanalei&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">
</head>

<body>
    <header class="header_wrap">
        <img src="./image/logo.png" alt="ロゴ">
        <nav class="pc_nav">
            <ul>
                <li>私について</li>
                <li>コンセプト</li>
                <li>制作実績</li>
                <li>スキル</li>
            </ul>
        </nav>
        <p>お問い合わせ</p>
    </header>

    <section>
        <h2>お問い合わせフォーム</h2>
        <p>お問い合わせはこちらのフィームからお願いいたします<br>
            InstagramのDMからも受け付けておりますので、そちらもご利用ください</p>
        <p>My Instagram <br>
            miwa.f_design</p>
    </section>
    <section class="inputfield">
        <div class="form-container">
            <div class="form-group"></div>
            <label for="name">お名前</label>
            <input type="text">


            <div class="form-group"></div>
            <label for="mail">メールアドレス</label>
            <input type="amail">

            <div class="form-group"></div>
            <label for="content">お問い合わせ内容</label>
            <textarea></textarea>
        </div>
        <div class="btn-row">
            <button class="submit-btn">送信する</button>
        </div>
    </section>

    <footer>
        <ul>
            <li>私について</li>
            <li>コンセプト</li>
            <li>制作実績</li>
            <li>スキル</li>
        </ul>
        <div class="logoblack">
            <img src="./image/logo-black.png" alt="黒いロゴ">
        </div>
    </footer>
</body>

</html>
