        <h2>麓から、共に山頂へ</h2>
        <h3>私の名字「麓」は、山の始まりを意味します。
            どんな挑戦も、最初の一歩は麓から始まります。

            まだ形になっていないアイデアや想いに寄り添い、
            進むべき道を一緒に描きながら、山頂を目指していく。

            小さな一歩も積み重ね、その先にある景色へ。
            麓から始まる挑戦を、
            共に登るパートナーでありたいと考えています。</h3>
