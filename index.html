<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ポートフォリオ_麓美和子</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hanalei&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic&display=swap" rel="stylesheet">

</head>

<body>
    <div class="mainvisual">
        <h1>FUMOTO DESIGN</h1>
        <img src="./画像/メインの山.svg" alt="メインの山">
        <h2>麓から、共に山頂へ</h2>
        <section class="concept">
            <p>私の名字「麓」は、山の始まりを意味します。<br>
                どんな挑戦も、最初の一歩は麓から始まります。<br>
            </p>
            <p>
                まだ形になっていないアイデアや想いに寄り添い、<br>
                進むべき道を一緒に描きながら、山頂を目指していく。<br>
            </p>
            <p>
                小さな一歩も積み重ね、その先にある景色へ。<br>
                麓から始まる挑戦を、<br>
                共に登るパートナーでありたいと考えています。</p>
        </section>
    </div>
</body>

</html>
